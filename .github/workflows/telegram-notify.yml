name: Telegram notify

# Notifies the owner's Telegram group/topic when a workflow run COMPLETES --
# for ANY conclusion (success, failure, cancelled, skipped, neutral, timed_out,
# action_required, stale, startup_failure), always, never silently skipped.
# Status icon mapping (owner-approved, FINAL) -- line 1 = icon + the ORIGINAL
# GitHub conclusion text, e.g. "✅ success":
#   success           -> ✅   failure           -> ❌   cancelled -> ⏹️
#   skipped           -> ⏭️   timed_out         -> ⏰   action_required -> ⚠️
#   neutral           -> ⚪   stale             -> ♻️   startup_failure -> 💥
#   anything unknown  -> ❓ (raw text kept, never crashes, never suppressed)
# Line 2 title: verbatim except GitHub's trailing squash-merge suffix -- a
# trailing " (#<digits>)" token at the END is stripped until none remain.
# PR block (round 4): after the empty line, one "PR #N" line per pull request
# of the run's commits (GitHub API /repos/{repo}/commits/{sha}/pulls per
# commit -- payload commits if present, else head_sha -- deduped, sorted
# ascending), then a second empty line; with no PRs the block and its
# separator are omitted entirely.
# Env line = environment label + address: "DEV: <dev URL>" for every build;
# "PROD: <prod URL>" only for a release build (version tag ref) AND when a
# prod URL secret exists -- with TELEGRAM_PROD_URL deleted and no v0.6.0 tag
# the PROD branch is currently impossible to reach. The addresses are private:
# only secrets.<NAME> names appear here, values are masked in every printed
# byte by the script (logs are public).
# Message format and setup: docs/telegram-ci-notifications.md
# Ticket: #101
#
# Loop guard: only the "product" workflows are listed below; this workflow's
# own runs are deliberately NOT a trigger source, otherwise every notification
# would trigger another notification forever.

on:
  workflow_run:
    workflows: ["CI", "Publish to PyPI"]
    types: [completed]
  workflow_dispatch:
    inputs:
      fake_conclusion:
        description: "Fake conclusion to test the mapping (e.g. failure, timed_out); empty = real"
        required: false
        default: ""
      title:
        description: "Override the run title (line 2 text)"
        required: false
        default: ""
      context:
        description: "Extra context line, e.g. 'PROD : https://example.com'; empty = CI-Context trailer / URL line only"
        required: false
        default: ""
      dry_run:
        description: "Print the payload instead of sending"
        type: boolean
        default: false

# Least-privilege token: read the repo (checkout) and read run metadata
# (actions/runs/<id>) -- nothing is written by this workflow.
permissions:
  contents: read
  actions: read

# Same grouping pattern as ci.yml (event-scoped, so push/PR/dispatch never
# collide), keyed on the notifying run itself. Unlike ci.yml this never
# cancels in progress: a notification must not be dropped because another
# run finished a second later.
concurrency:
  group: telegram-${{ github.event_name }}-${{ github.event.workflow_run.id || github.run_id }}
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332  # v4.1.7
        with:
          persist-credentials: false

      # TELEGRAM_BOT_TOKEN, TELEGRAM_DEV_URL and TELEGRAM_PROD_URL are
      # referenced ONLY through the secrets context -- never echo them, never
      # pass them to a step that prints its environment, and never write their
      # values into the repo (the dev URL is a real internal LAN address --
      # data-hygiene rule: it may exist only in the secret and in the message
      # text sent to the private chat). The script masks every environment URL
      # in everything it prints, so the public logs only ever show the mask.
      # TELEGRAM_PROD_URL has no value on purpose (deleted; no release yet) --
      # the empty value is what keeps the PROD label unreachable.
      - name: Send Telegram notification
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_DEV_URL: ${{ secrets.TELEGRAM_DEV_URL }}
          TELEGRAM_PROD_URL: ${{ secrets.TELEGRAM_PROD_URL }}
          TELEGRAM_CHAT_ID: "-1003577324021"
          TELEGRAM_THREAD_ID: "2681"
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          # Release gate for the PROD label: the triggering build's branch /
          # tag name first, else this run's own ref -- only a version tag
          # (refs/tags/v…) counts as a release build.
          BUILD_REF: ${{ github.event.workflow_run.head_branch || github.ref }}
          # url + number MUST come from the same run payload (line-2 rule):
          # workflow_run fields for trigger runs, this dispatch run's own
          # id/number for workflow_dispatch tests. Never mix the two.
          RUN_ID: ${{ github.event.workflow_run.id || github.run_id }}
          # PR block source (round 4): the triggering run's head commit when
          # the payload carries no commits list, else this run's own sha --
          # the script then calls /repos/{repo}/commits/{sha}/pulls per sha.
          HEAD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          RUN_NUMBER: ${{ github.event.workflow_run.run_number || github.run_number }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          DISPLAY_TITLE: ${{ github.event.workflow_run.display_title }}
          HEAD_MESSAGE: ${{ github.event.workflow_run.head_commit.message }}
          DISPATCH_CONCLUSION: ${{ inputs.fake_conclusion }}
          TITLE: ${{ inputs.title }}
          DISPATCH_CONTEXT: ${{ inputs.context }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          python3 .github/scripts/telegram_notify.py
