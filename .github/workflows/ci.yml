name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

# Least-privilege token: this workflow only reads the repo. Arbitrary
# dependency build code runs during install, so never expose a writable
# token to it (see the supply-chain notes in pyproject.toml).
permissions:
  contents: read

# Cancel superseded runs on the same ref (rapid PR pushes) instead of
# letting them pile up and post stale statuses. The group includes the
# event name (push/PR/dispatch never collide) and, on main, the run id:
# runs on main always run to completion — each merge is its own CI
# evidence (#28).
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.run_id || 'shared' }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332  # v4.1.7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v8.2.0  # v8.2.0
        with:
          version: "0.10.2"
          enable-cache: true

      # `uv sync --locked` installs the exact uv.lock resolution (direct AND
      # transitive deps) and fails if the lock is stale — a bare `pip install`
      # would ignore the lockfile and let transitive versions float, defeating
      # the repo's exact-pin supply-chain policy. Run `uv lock` and commit the
      # lockfile whenever pyproject dependencies change.
      #
      # `--extra api` is required: the REST tests (tests/test_api*.py) import
      # fastapi/uvicorn, which live in the `api` extra — without it pytest fails
      # at collection with ModuleNotFoundError: fastapi.
      - name: Install (locked)
        run: uv sync --locked --extra dev --extra api --python 3.12

      # --no-sync: don't let `uv run` re-sync without the dev extra and
      # uninstall the tools it is about to run.
      - name: Ruff lint
        run: uv run --no-sync ruff check .

      - name: Ruff format check
        run: uv run --no-sync ruff format --check .

      - name: Mypy
        run: uv run --no-sync mypy openkb

      - name: Pytest
        run: uv run --no-sync pytest

  # Build the Workbench SPA so a broken frontend (vite/config error, stale
  # package-lock, JS error) is caught here at PR time rather than only in
  # publish.yml after a release tag is pushed. Mirrors the release build step.
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332  # v4.1.7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4  # v4
        with:
          node-version: "20"

      - name: Build Workbench web bundle
        working-directory: frontend
        run: |
          npm ci
          npm run build

  # Packaging smoke: install the built wheel with ALL extras in a clean
  # python:3.11-slim container, check the CLI entry point and boot the
  # REST app (no LLM calls, no network beyond PyPI). Catches broken
  # wheels, missing deps and missing extras (#46 class).
  container-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.1.7  # v4.1.7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v8.2.0  # v8.2.0
        with:
          version: "0.10.2"
          enable-cache: true

      - name: Build wheel
        run: uv build --wheel

      - name: Boot smoke in clean container
        run: |
          docker run --rm -v "$PWD/dist:/dist:ro" -v "$PWD/.github/scripts:/smoke:ro" python:3.11-slim sh -c '
            set -e
            WHL=$(ls /dist/openkb-*.whl)
            pip install -q httpx "openkb[web,api,s3,gdrive,onedrive] @ file://${WHL}"
            openkb --help > /dev/null
            python /smoke/boot_smoke.py
          '

  # UI e2e skeleton (Playwright): build the SPA, install the packaged app
  # from the wheel, boot the REST app and run DOM-level smoke against the
  # Studio shell (load, SPA fallback, API wiring). No LLM calls.
  web-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.1.7  # v4.1.7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4  # v4
        with:
          node-version: "20"

      - uses: astral-sh/setup-uv@v8.2.0  # v8.2.0
        with:
          version: "0.10.2"
          enable-cache: true

      - name: Build SPA and wheel, install app
        run: |
          (cd frontend && npm ci && npm run build)
          uv build --wheel
          python3 -m pip install -q uvicorn httpx "openkb[web,api] @ file://$(ls $PWD/dist/openkb-*.whl)"

      - name: Install Playwright chromium
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run UI e2e
        working-directory: frontend
        run: npx playwright test
